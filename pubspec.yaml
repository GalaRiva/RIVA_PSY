name: riva_psy
description: RIVA PSY. applied psychology.

version: 1.0.9+55

environment: 
  sdk: '>=2.12.0 <3.0.0'


dependencies: 
  flutter: 
    sdk: flutter

  # db, save data
  hive:
  hive_flutter:
  shared_preferences: ^2.1.0

  #codegeneration
  retrofit: '>=4.0.0 <5.0.0'
  freezed_annotation: ^2.2.0
  freezed: ^2.3.5

  #state
  get: ^4.6.5
  flutter_bloc: ^8.1.3
  provider: ^6.1.2

  #localization
  easy_localization: ^3.0.5

  #connection
  url_launcher: 6.1.2
  dio:

  #audio
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  audio_session: ^0.1.22
  flutter_sound: ^9.4.5
  record: ^5.0.4

  #firebase
  firebase_messaging: ^15.2.0
  firebase_core: ^3.5.0
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.4.0
  cloud_functions: ^5.2.0

  #google
  google_api_availability: ^5.0.0
  googleapis:
  googleapis_auth:

  #sign in
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^6.1.1
  firebase_auth: ^5.3.0

  #notifications
  awesome_notifications: ^0.10.1
  flutter_local_notifications: ^17.2.4

  #ui
  flutter_rating_bar: ^4.0.1
  sleek_circular_slider:
    path: ./sleek_circular_slider-2.0.1-v2/
  pie_chart: ^5.3.2
  cached_network_image: ^3.2.1
  flutter_svg: ^2.3.0
  flutter_switch: ^0.3.2

  #file
  file_picker: ^8.0.7
  image_picker:
  path_provider: ^2.0.15
  flutter_svg_provider: ^1.0.3

  #other
  in_app_review: ^2.0.9
  uuid: ^3.0.7
  workmanager: ^0.6.0
  crypto: ^3.0.3
  permission_handler: ^11.3.0
  pdf: ^3.13.0
  printing: ^5.15.0
  google_fonts: ^8.2.1
  fl_chart: ^1.2.0
  vibration: ^3.2.0
  in_app_update: ^4.2.3
  in_app_purchase: ^3.2.0
  video_player: ^2.9.2
  webview_flutter: ^4.10.0
dev_dependencies:
  flutter_test: 
    sdk: flutter

  #codegeneration
  retrofit_generator: '>=5.0.0 <6.0.0'
  build_runner: '>=2.3.0 <4.0.0'
  json_serializable:
  flutter_launcher_icons: '^0.13.1'

flutter_launcher_icons:
    android: "ic_launcher"
    ios: false
    image_path: "assets/ic_launcher.png"
    # Deliberately flat/legacy icon only, no adaptive_icon_background /
    # adaptive_icon_foreground — that setup (mipmap-anydpi-v26/*.xml +
    # per-density drawable foreground layers) reliably correlated with
    # "Приложение не установлено, пакет недействителен" install failures
    # on a real device across several rebuilds (confirmed by reverting:
    # installs cleanly again without it). Not worth the adaptive-icon
    # parallax/masking effect until that's root-caused properly — this
    # app previously shipped fine with a flat icon for its whole history.
    min_sdk_android: 21 # android min sdk min:16, default 21


    web:
      generate: true
      image_path: "assets/app_icon.png"
      background_color: "#hexcode"
      theme_color: "#hexcode"
    windows:
      generate: true
      image_path: "assets/app_icon.png"
      icon_size: 48 # min:48, max:256, default: 48
    macos:
      generate: true
      image_path: "assets/app_icon.png"
flutter: 
  uses-material-design: true
  assets:
    - assets/
    - assets/translations/
    - assets/images/
    - assets/images/desires/

    - assets/images/pdf/
    - assets/images/recomendations/
    - assets/images/audio_covers/
    - assets/images/event_images/
    - assets/images/quiz/
    - assets/videos/
    - assets/videos/projection/
    - assets/fonts/
  shaders:
    - shaders/projection_orb.frag
  fonts:
    - family: Akrobat
      fonts: 
        - asset: assets/fonts/AkrobatBold.ttf
          weight: 700
    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SFProDisplayThin.ttf
          weight: 200
        - asset: assets/fonts/SFProDisplayLight.ttf
          weight: 300
        - asset: assets/fonts/SFProDisplayRegular.ttf
          weight: 400
        - asset: assets/fonts/SFProDisplayMedium.ttf
          weight: 500
    - family: Phosphor
      fonts:
        - asset: assets/fonts/Phosphor.ttf

dependency_overrides:
  archive: ^4.0.9
  pdf_widget_wrapper: ^1.0.4
  win32: ^5.6.0
  flutter_plugin_android_lifecycle: 2.0.24
  image_picker_android: ^0.8.13
  google_api_availability_android: ^1.1.0
  path_provider_android: ^2.2.5
  permission_handler_android: ^12.0.7
  shared_preferences_android: ^2.2.3
  sqflite: ^2.3.3+1
  url_launcher_android: ^6.3.3
  record_android: 1.2.6
  record_platform_interface: 1.2.0
