name: listenmebaby71_s_application17
description: Rigel PSY. applied psychology.

version: 1.0.6+7

environment: 
  sdk: '>=2.12.0 <3.0.0'


dependencies: 
  flutter: 
    sdk: flutter

  # db, save data
  hive:
  hive_flutter:
  shared_preferences: ^2.1.0

  #codegeneration
  retrofit: '>=4.0.0 <5.0.0'

  #state
  get: ^4.6.5
  flutter_bloc: ^8.1.3

  #localization
  easy_localization: ^3.0.3

  #connection
  url_launcher: 6.1.2
  dio:

  #audio
  just_audio: ^0.9.36
  audio_session: ^0.1.13
  flutter_sound: ^8.1.9
  record: ^4.4.4

  #firebase
  firebase_messaging: ^14.4.1
  firebase_analytics: ^10.4.4
  firebase_core: ^2.15.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.1.1

  #google
  google_api_availability: ^5.0.0
  googleapis:
  googleapis_auth:

  #sign in
  google_sign_in: ^6.1.5
  sign_in_with_apple: ^5.0.0
  firebase_auth: ^4.11.1

  #payment
  yookassa_payments_flutter: ^1.3.0
  uuid: ^3.0.7

  #notifications
  awesome_notifications: ^0.8.0
  flutter_local_notifications: ^14.0.0+1

  #ui
  flutter_rating_bar: ^4.0.1
  sleek_circular_slider:
    path: ./sleek_circular_slider-2.0.1-v2/
  audio_video_progress_bar: ^0.9.0
  pie_chart: ^5.3.2
  syncfusion_flutter_charts: ^21.1.39
  cached_network_image: ^3.2.1
  flutter_svg: ^1.1.6
  flutter_switch: ^0.3.2

  #file
  file_picker:
  image_picker:
  path_provider: ^2.0.15
  flutter_svg_provider: ^1.0.3

  #other
  workmanager: ^0.5.1
  crypto: ^3.0.3
  permission_handler: ^10.2.0
  pdf:
  printing: ^5.11.0
  timezone: ^0.9.2

dev_dependencies:
  flutter_test: 
    sdk: flutter

  #codegeneration
  retrofit_generator: '>=5.0.0 <6.0.0'
  build_runner: '>=2.3.0 <4.0.0'
  json_serializable:

  flutter_launcher_icons: '^0.13.1'

flutter_launcher_icons:
    android: "launcher_icon"
    ios: true
    image_path: "assets/app_icon.png"
    min_sdk_android: 21 # android min sdk min:16, default 21
    web:
      generate: true
      image_path: "assets/app_icon.png"
      background_color: "#hexcode"
      theme_color: "#hexcode"
    windows:
      generate: true
      image_path: "assets/app_icon.png"
      icon_size: 48 # min:48, max:256, default: 48
    macos:
      generate: true
      image_path: "assets/app_icon.png"
flutter: 
  uses-material-design: true
  assets:
    - assets/
    - assets/translations/
    - assets/images/
    - assets/images/pdf/
    - assets/images/recomendations/
    - assets/images/event_images/
    - assets/fonts/
  fonts: 
    - family: Akrobat
      fonts: 
        - asset: assets/fonts/AkrobatBold.ttf
          weight: 700
    - family: SF Pro Display
      fonts: 
        - asset: assets/fonts/SFProDisplayThin.ttf
          weight: 200
        - asset: assets/fonts/SFProDisplayLight.ttf
          weight: 300
        - asset: assets/fonts/SFProDisplayRegular.ttf
          weight: 400
        - asset: assets/fonts/SFProDisplayMedium.ttf
          weight: 500
