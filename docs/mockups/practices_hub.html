<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Практики: макеты</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap"><style>
:root{--bg:#EEF1F0;--ink:#1A1C1E;--mut:#5f686d;--line:#d9dfde}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a19;--ink:#e8eceb;--mut:#a3adab;--line:#2c3533}}
:root[data-theme="dark"]{--bg:#151a19;--ink:#e8eceb;--mut:#a3adab;--line:#2c3533}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;padding:28px 16px 40px}
header{max-width:1080px;margin:0 auto 22px}
header h1{font-size:26px;font-weight:600;margin:0 0 6px;text-wrap:balance}
header p{margin:0;color:var(--mut);font-size:14px;max-width:62ch;line-height:1.55}
.grid{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:28px 20px;align-items:start;justify-items:center}
.fig{margin:0;width:100%;max-width:300px}
figcaption{font-size:13px;color:var(--mut);margin-top:10px;line-height:1.5;text-align:center}
figcaption b{color:var(--ink);font-weight:600}
.ph{background:#F9FAFA;color:#1A1C1E;border:1px solid var(--line);border-radius:34px;overflow:hidden;display:flex;flex-direction:column;font-size:12px;line-height:1.35}
.sb{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 2px;font-size:11px;font-weight:600}
.notch{width:70px;height:16px;border-radius:10px;background:#1A1C1E}
.body{padding:10px 14px 14px;display:flex;flex-direction:column;gap:12px;min-height:520px}
.h1{font-size:21px;font-weight:600;margin:0}.h2{font-size:17px;font-weight:600}
.sub{font-size:12px;color:#7A8287;margin:0}
.t{font-size:12.5px;font-weight:600}.s{font-size:11px;color:#7A8287}
.orb{align-self:center;width:130px;height:130px;border-radius:50%;background:#E4EFEA;display:flex;align-items:center;justify-content:center}
.orb div{width:62px;height:62px;border-radius:50%;background:#fff;border:1px solid #cfd8d5}
.lr{display:flex;justify-content:space-between;padding:0 18px;font-size:11px;color:#7A8287}
.b1,.b2{border-radius:12px;padding:10px;text-align:center;font-size:11.5px;letter-spacing:.03em}
.b1{border:1px solid #2A5C55;color:#2A5C55}.b2{background:#1499A1;color:#fff}
.steps{display:flex;align-items:center;gap:10px;background:#EEEBF8;border:1px solid #ddd8f0;border-radius:16px;padding:10px 12px}
.steps .t{color:#3f3585}.steps .s{color:#6f66ad}
.st-ic{width:32px;height:32px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.sos{border-radius:20px;background-size:cover;background-position:center;overflow:hidden}
.sos-in{display:flex;align-items:center;gap:10px;padding:14px;background:rgba(14,38,40,.52);color:#fff}
.sos .t{color:#fff;font-size:14px}.sos .s{color:#d8e6e4}
.blk{background:#fff;border:1px solid #EAEEEE;border-radius:22px;padding:12px}
.blk.mint{background:#E3EEEA;border-color:#d3e2dc}
.bh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.bt{font-size:13.5px;font-weight:600}.cnt{font-size:11px;color:#2A5C55}.lnk{font-size:11px;color:#2A5C55;font-weight:500}
.start{display:flex;gap:10px;align-items:center}
.row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px}
.row .done{color:#7A8287;text-decoration:line-through;flex:1}.row span:not(.done){flex:1}
.d{width:16px;height:16px;border-radius:50%;border:1.3px solid #2A5C55;flex:none;display:flex;align-items:center;justify-content:center}
.d.on{background:#2A5C55}
.thumb{width:62px;height:96px;border-radius:16px;background-size:cover;background-position:center;flex:none}
.cont{display:flex;align-items:center;gap:10px}
.cv{width:46px;height:46px;border-radius:14px;background-size:cover;background-position:center;flex:none}
.pl{width:32px;height:32px;border-radius:50%;background:#2A5C55;display:flex;align-items:center;justify-content:center;flex:none;padding-left:2px}
.prog{height:3px;background:#E4EFEA;border-radius:2px;margin-top:6px}.prog b{display:block;height:3px;background:#2A5C55;border-radius:2px}
.prog.p{background:#E6E2F6}.prog.p b{background:#5b4ea8}
.hs{display:flex;gap:8px}
.pc{flex:1;min-width:0;height:96px;border-radius:16px;background-size:cover;background-position:center;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:9px;color:#fff}
.pc::before{content:"";position:absolute;inset:0;background:rgba(10,24,26,.42)}
.pc>*{position:relative}.pc-t{font-size:12px;font-weight:600}.pc-s{font-size:10.5px;color:#dbe7e5}
.pc.sq{height:84px}
.emo{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.emo-art{width:70px;height:70px;border-radius:16px;background-size:cover;background-position:center;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(255,255,255,.65);border:1px solid #fff;color:#2A5C55;border-radius:16px;padding:5px 10px;font-size:11.5px}
.chip.d{background:#fff;border:1px solid #cfd8d5;color:#1A1C1E;width:auto;height:auto;flex:none}
.path{padding:0;overflow:hidden}
.ban{height:150px;background-size:cover;background-position:center}
.ban-in{height:100%;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(48,26,8,.36);color:#fff}
.eyebrow{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#ffe3b0}
.eyebrow.p{color:#5b4ea8}
.bt2{font-size:19px;font-weight:600;margin:1px 0}.s2{font-size:11px;color:#fff0d6}
.list{padding:4px 12px 6px}
.li{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #EFEDF7}
.li:last-child{border:0}
.nav{display:flex;align-items:center;gap:8px}
.head-pill{display:flex;align-items:center;gap:8px;background:#2A5C55;color:#fff;border-radius:22px;padding:8px 14px;font-size:12.5px}
.ac{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #EAEEEE;border-radius:20px;padding:10px}
.ac .cv{width:50px;height:50px}
.glass{background:#E3EEEA;border-radius:24px;padding:14px;position:relative;min-height:190px}
.gt{font-size:13.5px;font-weight:600;color:#2A5C55;margin-bottom:46px}
.gart{position:absolute;right:12px;top:10px;width:74px;height:74px;border-radius:16px;background-size:cover;background-position:center}
.gc{background:rgba(255,255,255,.42);border:1.2px solid #fff;border-radius:22px;padding:9px 14px;font-size:12px;color:#2A5C55;margin-top:7px;backdrop-filter:blur(8px)}
.hc{border-radius:20px;background-size:cover;background-position:center;overflow:hidden}
.hc-in{padding:16px 14px;background:rgba(10,28,30,.5);color:#fff;min-height:100px;display:flex;flex-direction:column;justify-content:flex-end}
.hc .t{font-size:16px;color:#fff}.hc .s{color:#dbe7e5}.hc-k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#cfe3df;margin-bottom:2px}
.safe{background:#fff;border:1px solid #EAEEEE;border-radius:16px;padding:11px 12px;font-size:11.5px;color:#444;line-height:1.5}
.tabs{display:flex;gap:6px;overflow:hidden}
.tb{font-size:11.5px;padding:6px 11px;border-radius:16px;background:#fff;border:1px solid #EAEEEE;white-space:nowrap}
.tb.on{background:#E4EFEA;color:#2A5C55;border-color:#cfe0d8}
.self{background:#fff;border:1px solid #ddd8f0;border-radius:22px;overflow:hidden}
.self-ban{height:110px;background-size:cover;background-position:center 30%;background-color:#0f1a2a}
.self-in{padding:12px}
.sbtn{margin-top:10px;background:#5b4ea8;color:#fff;border-radius:20px;text-align:center;padding:9px;font-size:12px}
.card2{background:#fff;border:1px solid #EAEEEE;border-radius:18px;padding:12px}
.hero{margin:-10px -14px 0;height:118px;background-size:cover;background-position:center;position:relative}.hero-in{height:100%;padding:12px 16px;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(6,18,24,.46);color:#fff}.hero .h1{color:#fff}.hero .sub{color:#d6e4e6}
.bar{border-top:1px solid #EAEEEE;background:#fff;display:flex;justify-content:space-around;align-items:flex-end;padding:7px 4px 12px;color:#7A8287;margin-top:auto}
.bi{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;width:20%}
.bi.on{color:#2A5C55}
.ctr{width:40px;height:40px;border-radius:50%;background:#1499A1;display:flex;align-items:center;justify-content:center;margin-top:-18px}
</style></head><body>
